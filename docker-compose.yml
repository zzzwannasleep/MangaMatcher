# KomgaBangumi Docker 版 —— docker compose 示例
# 用法：docker compose up -d，然后打开 http://localhost:8080（默认 admin / admin123）
# 首次启动后在「系统设置」页填 Komga 地址与 API Key（或直接改下方环境变量种子）

services:
  komgabangumi:
    # 预构建多架构镜像（amd64 / arm64）——本目录无需源码即可部署
    image: ghcr.io/zzzwannasleep/mangamatcher:latest
    # 自己构建镜像时注释上一行、取消下一行注释（需要完整仓库上下文）
    # build: .
    container_name: komgabangumi
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 首次启动的 admin 引导账号（仅在库内无用户时创建；登录后请在界面里改密码）
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # Komga 连接种子配置（之后可在 Web 设置页修改，DB 配置优先）
      KOMGA_URL: http://komga:25600
      KOMGA_API_KEY: ""
      # Bangumi 访问 token（可选，NSFW 搜索需要）: https://bgm.tv/settings/api
      BANGUMI_TOKEN: ""
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    # 与 Komga 同网络互通时可省去暴露 Komga 端口（见下方示例服务）：
    # networks: [komga]

  # 如 Komga 也用 compose 部署，取消注释并加入同一网络（KOMGA_URL 填服务名 http://komga:25600）：
  # komga:
  #   image: gotson/komga:latest
  #   ports: ["25600:25600"]
  #   volumes: ["/path/to/comics:/data:ro", "./komga:/config"]
  #   networks: [komga]

# networks:
#   komga:
