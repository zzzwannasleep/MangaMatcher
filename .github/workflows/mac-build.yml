name: macOS Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon (arm64)
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: ver
        run: echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build cross-platform projects
        run: |
          dotnet build src/KomgaScraper.Core/KomgaScraper.Core.csproj -c Release
          dotnet build tools/TestCli/TestCli.csproj -c Release
          for t in tests/*/; do
            proj=$(find "$t" -maxdepth 1 -name '*.csproj')
            [ -n "$proj" ] && dotnet build "$proj" -c Release
          done

      - name: Publish GUI (osx-arm64)
        run: >
          dotnet publish src/KomgaScraper.App/KomgaScraper.App.csproj
          -c Release -r osx-arm64 --self-contained false
          -p:PublishSingleFile=true
          -p:EnableWindowsTargeting=true
          -p:Version=${{ env.version }}
          -p:InformationalVersion=${{ env.version }}

      - name: Publish GUI (osx-x64)
        run: >
          dotnet publish src/KomgaScraper.App/KomgaScraper.App.csproj
          -c Release -r osx-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:EnableWindowsTargeting=true
          -p:Version=${{ env.version }}
          -p:InformationalVersion=${{ env.version }}

      - name: Package
        run: |
          cd src/KomgaScraper.App/bin/Release/net8.0-windows/osx-arm64/publish
          zip -qr "$GITHUB_WORKSPACE/KomgaScraper-${{ env.version }}-macos-arm64.zip" .
          cd "$GITHUB_WORKSPACE/src/KomgaScraper.App/bin/Release/net8.0-windows/osx-x64/publish"
          zip -qr "$GITHUB_WORKSPACE/KomgaScraper-${{ env.version }}-macos-x64.zip" .
          cd "$GITHUB_WORKSPACE/tools/TestCli/bin/Release/net8.0/osx-arm64/publish"
          zip -qr "$GITHUB_WORKSPACE/KomgaScraper-CLI-${{ env.version }}-osx-arm64.zip" .
          cd "$GITHUB_WORKSPACE/tools/TestCli/bin/Release/net8.0/osx-x64/publish"
          zip -qr "$GITHUB_WORKSPACE/KomgaScraper-CLI-${{ env.version }}-osx-x64.zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.version }}
          path: |
            KomgaScraper-*-macos-*.zip
            KomgaScraper-CLI-*.zip
          if-no-files-found: error
