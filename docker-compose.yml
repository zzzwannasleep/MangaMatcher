# KomgaBangumi Docker 版 —— docker compose 示例
# 用法：先在「设置」页或环境变量里填 Komga 地址与 API Key，然后 docker compose up -d
services:
  komgabangumi:
    build: .
    image: komgabangumi:latest
    container_name: komgabangumi
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 首次启动的 admin 引导账号（登录后请在界面里改密码）
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # Komga 连接种子配置（之后可在 Web 设置页修改，DB 配置优先）
      KOMGA_URL: http://komga:25600
      KOMGA_API_KEY: ""
      # Bangumi 访问 token（可选，NSFW 搜索需要）: https://bgm.tv/settings/api
      BANGUMI_TOKEN: ""
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    # 与 Komga 同网络时可省去暴露 Komga 端口：
    # networks: [komga]

  # 如 Komga 也用 compose 部署，取消注释并同网络互通：
  # komga:
  #   image: gotson/komga:latest
  #   ports: ["25600:25600"]
  #   volumes: ["/path/to/comics:/data:ro", "./komga:/config"]