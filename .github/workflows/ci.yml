name: ci

# 测试门禁：go vet + 全量测试 + 前端构建（不含 Docker 镜像——见 docker.yml，
# 不构建桌面版客户端 src/——见 release.yml）。只认 Docker 版路径。

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: go test
        working-directory: server
        run: go test ./... -count=1

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci + build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
