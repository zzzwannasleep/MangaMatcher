name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish src/KomgaScraper.App/KomgaScraper.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}

      - name: Package
        shell: pwsh
        run: >
          Compress-Archive
          -Path "src/KomgaScraper.App/bin/Release/net8.0-windows/win-x64/publish/*"
          -DestinationPath "KomgaScraper-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: KomgaScraper-${{ steps.ver.outputs.version }}-win-x64.zip
          generate_release_notes: true
